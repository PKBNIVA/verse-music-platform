default: &default
  adapter: postgresql
  encoding: unicode
  # Puma threads + in-process GoodJob threads + headroom for the GoodJob
  # notifier/scheduler and ad-hoc connections.
<% require Rails.root.join("config/job_queues").to_s %>
  # Job threads come from the GoodJob pools in config/job_queues.yml (JobQueues.thread_count);
  # Action Cable's workers come from config/realtime.yml (worker_pool_size), plus one connection
  # for Solid Cable's listener.
<% realtime_workers = YAML.safe_load_file(Rails.root.join("config/realtime.yml")).fetch("worker_pool_size").to_i + 1 %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i + JobQueues.thread_count + realtime_workers + 3 %>
  url: <%= ENV["DATABASE_URL"] %>
  # statement_timeout / lock_timeout per process kind (web, GoodJob worker, db:* tasks);
  # see config/database_session_settings.rb for the defaults and env overrides.
<% require Rails.root.join("config/database_session_settings").to_s %>
<% session_limits = DatabaseSessionSettings.variables %>
  # jit off: the ranked list queries (talent, acts, search) cost more than jit_above_cost, so Postgres
  # compiled them with LLVM on every request, which took ~45 ms of a ~250 ms query at 50k profiles
  # and never paid back on a query that returns one page (docs/PERFORMANCE.md).
  variables:
    statement_timeout: "<%= session_limits[:statement_timeout] %>"
    lock_timeout: "<%= session_limits[:lock_timeout] %>"
    jit: "off"

development:
  <<: *default
  database: musilynk_development

test:
  <<: *default
  database: musilynk_test

production:
  <<: *default
