services:
  - type: web
    name: verse-music-platform
    runtime: node
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    maxShutdownDelaySeconds: 30
    disk:
      name: verse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/verse.db
      - key: ALLOW_LOCAL_UPLOADS
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PRO
        sync: false
      - key: RAZORPAY_PLAN_STUDIO
        sync: false
      - key: EMAIL_DELIVERY_WEBHOOK
        sync: false
      - key: EMAIL_DELIVERY_TOKEN
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: ELASTICSEARCH_INDEX_PREFIX
        value: verse
      - key: OBJECT_STORAGE_UPLOAD_WEBHOOK
        sync: false
      - key: OBJECT_STORAGE_TOKEN
        sync: false

previews:
  generation: off
